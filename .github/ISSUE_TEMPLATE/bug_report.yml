name: Bug report
description: Report a reproducible UAWP defect without sharing private data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private workspace content, or Agent conversations. Report security issues through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: UAWP version
      description: Paste the output of `uawp version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Linux x86-64
        - Linux ARM64
        - Windows x86-64
        - Unsupported or unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal temporary workspace and replace private values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, private paths, workspace content, and conversation content.
          required: true
