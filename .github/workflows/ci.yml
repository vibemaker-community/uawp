name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            extension: ""
            race: false
          - runner: macos-15-intel
            extension: ""
            race: false
          - runner: ubuntu-24.04
            extension: ""
            race: true
          - runner: ubuntu-24.04-arm
            extension: ""
            race: false
          - runner: windows-2025
            extension: .exe
            race: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          gofmt -w .
          git diff --exit-code
      - run: go test ./...
      - if: matrix.race
        run: go test -race ./...
      - run: go vet ./...
      - name: Build and inspect CLI
        shell: bash
        run: |
          go build -trimpath -o "uawp-ci${{ matrix.extension }}" ./cmd/uawp
          "./uawp-ci${{ matrix.extension }}" version --format json
      - name: Exercise lifecycle and preservation
        run: go test ./internal/e2e -run 'TestHumanStyleCurrentDirectoryLifecyclePreservesOfficeFiles|TestLifecycleEndToEnd' -count=1
